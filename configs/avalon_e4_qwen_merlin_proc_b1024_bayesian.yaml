# If Qwen/Merlin/proc reaches 40%+, the result is model-independent.
# If it doesn't, Merlin/proc advantage is Llama-specific — a different but
# equally publishable finding.
#
# Pair with existing: avalon_e4_qwen_min_b64_256_1024_bayesian (Servant/min).

run_name: avalon_e4_qwen_merlin_proc_b1024_bayesian

model:
