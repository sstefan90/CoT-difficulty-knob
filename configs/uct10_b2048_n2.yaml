# B=2048 vs UCT-10, N=2.
# Very weak opponent — only 10 MCTS iterations per move, essentially random play.
# Useful to check whether the model can beat a near-random baseline at all.

run_name: uct10_b2048_n2
game: reversi
prompt_variant: free_cot

model:
  backend: ollama
  name: deepseek-r1:7b
  base_url: http://localhost:11434
  temperature: 0.0
  extra: {}

opponent:
  kind: uct
  iterations: 10

memory:
  kind: last_move

budgets: [2048]
n_per_cell: 2
llm_plays: black
max_turns_safety: 200
