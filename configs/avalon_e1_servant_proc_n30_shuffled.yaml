# Avalon E1 — Llama 8B, Servant, procedural, B=64+1024, N=30, shuffled roles
# Shuffled rerun of avalon_e1_servant_n50_procedural.yaml (N=50, fixed-pos).
# Corrects evil-position pinning (P3/P4 artifact) for fair Bayesian evaluation.

run_name: avalon_e1_servant_proc_bayesian

model:
  backend: sglang
  name: meta-llama/Meta-Llama-3.1-8B-Instruct
  base_url: http://localhost:30000
  temperature: 0.0
  think: false

llm_role: Servant
llm_player_idx: 0
prompt_variant: procedural

budgets: [64, 1024]
n_per_cell: 30
with_summarizer: true
summarizer_backend: anthropic
shuffle_all_roles: true
bot_strategy: bayesian
