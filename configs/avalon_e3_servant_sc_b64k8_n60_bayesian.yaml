# Avalon E3 — SC probe: K=8 × B=64 (compute ≡ B=512), N=60
# Purpose: sharpen the SC-can't-substitute claim for Story C.
#   Current K=4 N=30 returned 0/30 wins (p=0.49 — underpowered).
#   K=8 × B=64 = 512 effective tokens per decision, matching the budget
#   that actually moves the needle on win rate (K=1 B=512 → 30%).
#   If K=8 stays near zero while K=1 B=512 = 22%, the call-structure
#   interaction claim becomes a sharp, statistically significant result.
#
# Compute note: 8 reasoning chains per decision × ~3 decisions/game × 60 games
# = ~1440 Pass-1 calls at B=64 (~720 game-equivalents of LLM compute).

run_name: avalon_e3_servant_sc_b64k8_n60_bayesian

model:
  backend: sglang
