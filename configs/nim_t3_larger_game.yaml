# T3 — larger-game sweep on Nim [7,11,13] (MEDIUM PRIORITY)
# Question: Does a harder Nim config produce a non-flat budget curve?
# PREREQUISITE: recompute random-vs-random anchor for [7,11,13] before interpreting
# results — do NOT use the [3,5,7] 50% anchor here (it does not transfer).
# Positive: a budget cell exceeds recomputed random anchor by ≥ 20 pp, p < 0.05.
# Negative: all cells at random anchor → failure mode is not a function of game size.
run_name: nim_t3_larger_game
