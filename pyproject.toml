[project]
name = "cot-knob"
version = "0.1.0"
description = "CoT budget as a compute-grounded difficulty knob for LLM game agents (CS 348K Spring 2026)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Stephone Christian", email = "stephone@stanford.edu" }]
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "scipy>=1.13.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
ludii = [
    "jpype1>=1.5.0",
]
notebooks = [
    "jupyterlab>=4.0.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cot_knob"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "ollama: requires a running Ollama server",
    "ludii: requires Ludii.jar in third_party/",
]
